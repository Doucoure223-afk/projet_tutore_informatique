# Activated only by compose.https.yaml (-D CYBERSHIELD_TLS).
<IfDefine CYBERSHIELD_TLS>
    <VirtualHost *:443>
        ServerName localhost
        DocumentRoot /var/www/html
        SSLEngine on
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCertificateFile /run/secrets/tls_certificate
        SSLCertificateKeyFile /run/secrets/tls_private_key
        Header always set Strict-Transport-Security "max-age=86400"
        ErrorLog /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined
    </VirtualHost>
</IfDefine>
